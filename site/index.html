<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo BAP · Componentes de qualidade</title>
<meta name="description" content="Catálogo online BAP Autoparts: busque peças por código, referência cruzada, veículo e aplicação.">
<link rel="icon" href="assets/logo_escuro.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topo">
  <div class="topo-in">
    <a href="#/" class="marca" aria-label="Catálogo BAP: início"><img src="assets/logo_escuro.png" alt="bap componentes de qualidade"><span>Catálogo</span></a>
    <nav class="menu" aria-label="Menu">
      <a href="#/">Início</a>
      <a href="#/busca">Produtos</a>
      <a href="#/sobre">Sobre a BAP</a>
      <a href="#contato">Fale conosco</a>
    </nav>
  </div>
</header>

<main id="app" tabindex="-1">
  <div class="carregando" id="carregando">Carregando o catálogo…</div>
</main>

<footer class="rodape" id="contato">
  <div class="rodape-in">
    <div>
      <h2>Fale Conosco</h2>
      <p>Dúvidas sobre aplicação, código ou referência? Fale com o seu representante BAP.</p>
      <p class="mini" id="info-base"></p>
    </div>
    <img src="assets/logo_branco.png" alt="bap componentes de qualidade" class="rodape-logo">
  </div>
  <div class="rodape-fim">© BAP Autoparts · As fotos são ilustrativas. Confira sempre a aplicação antes da compra.</div>
</footer>

<template id="tpl-busca">
  <section class="cartao-busca" aria-label="Buscar produtos">
    <div class="abas" role="tablist">
      <button role="tab" data-aba="geral" aria-selected="true">Busca geral</button>
      <button role="tab" data-aba="veiculo" aria-selected="false">Veículo</button>
      <button role="tab" data-aba="codigo" aria-selected="false">Código da peça</button>
    </div>
    <form class="form-busca" autocomplete="off">
      <div class="campos" data-campos="geral">
        <label class="campo largo"><span>O que você procura?</span>
          <input name="q" type="search" placeholder="Ex.: amortecedor dianteiro Onix, pastilha Hilux, 15W40"></label>
      </div>
      <div class="campos" data-campos="veiculo" hidden>
        <label class="campo"><span>Montadora</span><select name="mo"><option value="">Todas</option></select></label>
        <label class="campo"><span>Modelo</span><input name="modelo" type="search" placeholder="Ex.: Gol, Strada, Hilux"></label>
        <label class="campo curto"><span>Ano</span><input name="ano" type="number" inputmode="numeric" min="1960" max="2035" placeholder="Ex.: 2018"></label>
        <label class="campo"><span>Sistema</span><select name="si"><option value="">Todos</option></select></label>
      </div>
      <div class="campos" data-campos="codigo" hidden>
        <label class="campo largo"><span>Código BAP, código original ou do concorrente</span>
          <input name="cod" type="search" placeholder="Ex.: AMT7115, HG33064, 16470"></label>
      </div>
      <div class="botoes">
        <button type="reset" class="bt bt-claro">Limpar</button>
        <button type="submit" class="bt">Buscar</button>
      </div>
    </form>
  </section>
</template>

<script src="app.js"></script>
</body>
</html>
