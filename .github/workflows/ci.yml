# CI do PR do Bap Ajuda catálogo (20/11/2026). Merge: ver CLAUDE.md, Merge (R-20261120-111308-alexandre).
name: ci
on:
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Donos (cada agente só no que é dele)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/coord.mjs verificar --base "origin/$BASE_REF"
      - name: Governança (lista os caminhos de governança; não bloqueia)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node scripts/coord.mjs governanca --base "origin/$BASE_REF" || echo "::warning::PR com caminho de governança: o po confere esses arquivos antes de autorizar o merge"
      - name: Python compila
        run: python -m compileall -q -x '(docs|catalogo_grafico/entregas)/' .
      - name: Site (gera o JSON e confere a TRAVA; sem fotos)
        run: |
          pip install -q openpyxl
          python scripts/gerar_site.py
          git diff --stat -- site/data || true
      - name: Testes da CLI e dos guardiões
        env:
          BAP_AGENTES_TESTE: gerente-projetos,po,catalogo-dados,catalogo-grafico,web-site,integracao-placas,testes,revisor-codigo,designer-ux,design-de-marca,corretor-redundancias
        run: node --test scripts/coord-recados.test.mjs scripts/coord-verificar.test.mjs .claude/hooks/guarda-agente.test.mjs .claude/hooks/guarda-recado.test.mjs .claude/hooks/guarda-merge-mcp.test.mjs
