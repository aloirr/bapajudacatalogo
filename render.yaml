# Catálogo BAP online no Render. Desde a T-0022 o site/ é servido só com login pelo bapajudacatalogo-login (abaixo);
# o serviço estático bapajudacatalogo ficou só para levar o endereço antigo ao novo. A base .xlsx NÃO vai para o ar.
# Render → Blueprints → aloirr/bapajudacatalogo → Sync.
services:
  # Endereço antigo (T-0022, fase B): só redireciona para o catálogo com login. Os links #/produto/... seguem valendo.
  - type: web
    name: bapajudacatalogo
    runtime: static
    buildCommand: |
      mkdir -p redirecionamento
      printf '%s' '<!doctype html><meta charset="utf-8"><title>Catálogo BAP</title><script>location.replace("https://bapajudacatalogo-login.onrender.com/"+location.search+location.hash)</script><a href="https://bapajudacatalogo-login.onrender.com/">Catálogo BAP</a>' > redirecionamento/index.html
    staticPublishPath: ./redirecionamento
    pullRequestPreviewsEnabled: false
    routes:
      - type: redirect
        source: /*
        destination: https://bapajudacatalogo-login.onrender.com/
  # Busca por placa (T-0005): serviço pequeno que consulta a API PLACAS com a chave só em variável de ambiente.
  # A chave (API_PLACAS_TOKEN) é criada pelo Alexandre no painel do Render; nunca vai para o Git.
  # Plano pago (não dorme) e disco persistente para guardar placa -> veículo (decisão do Alexandre, R-20261120-110140).
  - type: web
    name: bapajudacatalogo-placas
    runtime: node
    plan: starter
    rootDir: servicos/placas
    buildCommand: 'echo "sem dependencias"'
    startCommand: node server.mjs
    healthCheckPath: /saude
    disk:
      name: placas-guardadas
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: API_PLACAS_TOKEN
        sync: false
      - key: ORIGEM_PERMITIDA
        value: https://bapajudacatalogo-login.onrender.com
      # T-0022, fase B: o /contar lê os códigos pelo login (rota interna com a chave gerada pelo Render).
      - key: CATALOGO_URL
        value: https://bapajudacatalogo-login.onrender.com
      - key: CHAVE_INTERNA
        fromService:
          type: web
          name: bapajudacatalogo-login
          envVarKey: CHAVE_INTERNA
      - key: PASTA_GUARDA
        value: /var/data
  # Login do catálogo (T-0022): serve o site/ inteiro só com login. Sem rootDir: lê site/ e os 2 PDFs de catalogo_grafico/entregas/.
  # A senha inicial do admin (ADMIN_SENHA_INICIAL) é digitada pelo Alexandre no painel; nunca vai para o Git.
  - type: web
    name: bapajudacatalogo-login
    runtime: node
    plan: starter
    buildCommand: 'echo "sem dependencias"'
    startCommand: node servicos/login/server.mjs
    healthCheckPath: /saude
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - site/**
        - servicos/login/**
        - catalogo_grafico/entregas/Catalogo_BAP_*_Completo_Digital.pdf
        - catalogo_grafico/entregas/Catalogo_BAP_*_A4_grafica.pdf
    disk:
      name: login-usuarios
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PASTA_DADOS
        value: /var/data
      - key: ADMIN_USUARIO
        value: admin
      - key: ADMIN_SENHA_INICIAL
        sync: false
      - key: SESSAO_SEGREDO
        generateValue: true
      - key: CHAVE_INTERNA
        generateValue: true
