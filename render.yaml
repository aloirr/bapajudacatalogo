# Catálogo BAP online no Render (site estático, sem servidor).
# Render → New → Blueprint → aloirr/bapajudacatalogo. Publica só a pasta site/ (a base .xlsx NÃO vai para o ar).
services:
  - type: web
    name: bapajudacatalogo
    runtime: static
    buildCommand: 'echo "site estatico: os dados vem prontos de scripts/gerar_site.py"'
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: false
    headers:
      - path: /data/*
        name: Cache-Control
        value: no-cache
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
  # Busca por placa (T-0005): serviço pequeno que consulta a API PLACAS com a chave só em variável de ambiente.
  # A chave (API_PLACAS_TOKEN) é criada pelo Alexandre no painel do Render; nunca vai para o Git.
  # Plano pago (não dorme) e disco persistente para guardar placa -> veículo (decisão do Alexandre, R-20261120-110140).
  - type: web
    name: bapajudacatalogo-placas
    runtime: node
    plan: starter
    rootDir: servicos/placas
    buildCommand: 'echo "sem dependencias"'
    startCommand: node server.mjs
    healthCheckPath: /saude
    disk:
      name: placas-guardadas
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: API_PLACAS_TOKEN
        sync: false
      - key: ORIGEM_PERMITIDA
        value: https://bapajudacatalogo.onrender.com
      - key: PASTA_GUARDA
        value: /var/data
  # Login do catálogo (T-0022): serve o site/ inteiro só com login. Sem rootDir: lê site/ e os 2 PDFs de catalogo_grafico/entregas/.
  # A senha inicial do admin (ADMIN_SENHA_INICIAL) é digitada pelo Alexandre no painel; nunca vai para o Git.
  # Fase A: sobe ao lado do site atual, que continua aberto até a fase B (redirecionamento).
  - type: web
    name: bapajudacatalogo-login
    runtime: node
    plan: starter
    buildCommand: 'echo "sem dependencias"'
    startCommand: node servicos/login/server.mjs
    healthCheckPath: /saude
    pullRequestPreviewsEnabled: false
    buildFilter:
      paths:
        - site/**
        - servicos/login/**
        - catalogo_grafico/entregas/Catalogo_BAP_*_Completo_Digital.pdf
        - catalogo_grafico/entregas/Catalogo_BAP_*_A4_grafica.pdf
    disk:
      name: login-usuarios
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PASTA_DADOS
        value: /var/data
      - key: ADMIN_USUARIO
        value: admin
      - key: ADMIN_SENHA_INICIAL
        sync: false
      - key: SESSAO_SEGREDO
        generateValue: true
      - key: CHAVE_INTERNA
        generateValue: true
